[project]
name = "cloud-locksmith-analyst-workbench"
version = "0.1.0"
description = "Policy-enforced Microsoft Graph broker for cloud security analysts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "PyJWT[crypto]>=2.8",
    "cryptography>=42",
    "msal>=1.28",
    "httpx>=0.27",
    "PyYAML>=6.0.1",
    "docker>=7.1",
    "jinja2==3.1.6",
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clw", "task_sdk/clw_task_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "task_sdk", "."]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "pg: needs the Postgres service from docker-compose",
    "sandbox: needs a Docker daemon; exercises the task sandbox",
    "tenant: needs the Microsoft 365 dev tenant (test accounts only)",
    "e2e: full compose stack with fake Graph",
    "redis: needs the Redis service from docker-compose",
]
