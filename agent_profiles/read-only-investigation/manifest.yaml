# An agent profile (SD-049): what an AI agent's session may call. A person
# chooses it when starting a session; the agent cannot. Same format as a task
# manifest; timeout_seconds is unused for sessions (the TTL is chosen at start).
schema_version: 1
id: read-only-investigation
version: 1
name: Read-only investigation
purpose: Investigate the directory without changing it. Changes are never executed; the agent can only propose them for a person to review.
permission_profile: agent-read-only-investigation
mode: app_only
allowed:
  - users.list_with_sign_in_activity
  - directory.list_role_definitions
  - directory.list_role_assignments
  - service_principals.list
  - service_principals.list_app_role_assigned_to
prohibited:
  - users.update
  - users.delete
  - directory_roles.add_member
approval_required: false
timeout_seconds: 300
# Inert change proposals an agent may file for a person to see (SD-054); never executed.
proposals: [disable_user]
# It reads the whole tenant's role map and app permissions: security leads only (SD-055).
start_roles: [security_lead]
